name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize the macOS images
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUTF8: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version="$(python3 pulse-cmd.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Directory.Build.props version $version"
            exit 1
          fi

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 pulse-cmd.py linux --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: python pulse-cmd.py windows --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*-setup.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install dmgbuild
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Write the notarization key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "PULSE_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build the dmg images
        env:
          PULSE_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          PULSE_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARIZE: ${{ github.event_name == 'push' || inputs.notarize }}
        run: |
          if [[ "$NOTARIZE" == "true" ]]; then
            python pulse-cmd.py mac --arch all
          else
            python pulse-cmd.py mac --arch all --no-notarize
          fi
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Sign the checksums
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          PULSE_UPDATE_KEY_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_KEY_PASSPHRASE }}
        run: |
          umask 077
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          PULSE_UPDATE_KEY="$RUNNER_TEMP/update-key.pem" python3 pulse-cmd.py sign
          rm "$RUNNER_TEMP/update-key.pem"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/PulseOffice-"$VERSION"-* artifacts/SHA256SUMS artifacts/SHA256SUMS.sig \
            --title "PulseOffice $VERSION" --generate-notes --verify-tag --draft
